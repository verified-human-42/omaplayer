# Builds the pacman package for x86_64 and aarch64 (Apple Silicon with
# Asahi, Snapdragon) and attaches both to the release, so install.sh never
# has to compile. Runs on every published release, or by hand for a tag.
name: Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach packages to
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare Arch
        run: |
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            pacman-key --init
            pacman-key --populate archlinuxarm
          fi
          pacman -Syu --noconfirm --needed git github-cli sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build the package
        run: |
          chown -R builder .
          cd pkgbuild
          sudo -u builder MAKEFLAGS="-j$(nproc)" makepkg -s --noconfirm

      - name: Attach it to the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" pkgbuild/omaplayer-[0-9]*-${{ matrix.arch }}.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
