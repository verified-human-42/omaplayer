  <text x="500" y="44" font-size="46" fill="url(#ink)" opacity="0.55">“</text>
  <text x="500" y="98" font-size="27" font-weight="700" fill="url(#ink)">PotPlayer on Windows is the best media player there is.</text>
  <text x="500" y="146" font-size="22" font-style="italic" fill="#EBCB8B">That's an opinion, and it isn't up for debate.</text>
