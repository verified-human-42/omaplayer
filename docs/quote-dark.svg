<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="PotPlayer on Windows is the best media player there is. That's an opinion, and it isn't up for debate. Omaplayer brings what makes it great to Omarchy.">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88C0D0"/>
      <stop offset="0.5" stop-color="#81A1C1"/>
      <stop offset="1" stop-color="#B48EAD"/>
